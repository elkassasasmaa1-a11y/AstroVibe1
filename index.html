<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroVibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a two-column mission console. Left rail holds the farm inputs and the Field Shift scenario;
   right column answers with ranked rotations, an orbital view of planting windows, and a stress test. */
:root{
  --bg:#EDF1EC; --surface:#F8FAF6; --ink:#14201B; --muted:#5A6A62; --line:#D2DBD3;
  --accent:#1F6F5B; --accent-ink:#FFFFFF; --clay:#B5541F; --bad:#B23A3A;
  --c1:#1F6F5B; --c2:#B5541F; --c3:#3E64B0;
  --f-display:'Bricolage Grotesque','Cairo',system-ui,sans-serif;
  --f-body:'Inter','Cairo',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1511; --surface:#121E19; --ink:#E6EEE8; --muted:#8FA398; --line:#25382F;
    --accent:#5CC9A7; --accent-ink:#06130E; --clay:#E58A52; --bad:#E27676;
    --c1:#5CC9A7; --c2:#E58A52; --c3:#86A9EA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#121E19; --ink:#E6EEE8; --muted:#8FA398; --line:#25382F;
  --accent:#5CC9A7; --accent-ink:#06130E; --clay:#E58A52; --bad:#E27676;
  --c1:#5CC9A7; --c2:#E58A52; --c3:#86A9EA; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:1280px;margin-inline:auto}
#app[dir=rtl]{font-family:'Cairo','Inter',system-ui,sans-serif}
svg{direction:ltr;max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#app[dir=rtl] .eyebrow{letter-spacing:0;font-family:'Cairo',sans-serif;font-size:12px}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block-end:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:transparent;border:0;padding:7px 14px;cursor:pointer;font-size:13px}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.lede{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;padding-block:18px 26px}
.lede p{margin:0;font-family:var(--f-display);font-size:clamp(20px,3.2vw,28px);line-height:1.2;font-weight:500;max-width:30ch;text-wrap:balance}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

.rail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:20px}
.rail h3{font-family:var(--f-display);font-size:16px;margin:0 0 10px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-block-end:12px}
.field:last-child{margin-block-end:0}
.field label,.field .lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field .val{color:var(--ink);font-family:var(--f-mono);font-size:13px}
select{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;padding:7px 8px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}

.sec{margin-block-end:40px}
.sec>h2{font-family:var(--f-display);font-size:23px;margin:4px 0 14px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sec>.eyebrow{display:block}
.sub{color:var(--muted);margin:-8px 0 14px;max-width:70ch}

.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rcard{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard .score{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--accent)}
.chain{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.3;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.chain .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.arr{color:var(--muted)}
#app[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:76px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
#app[dir=rtl] .bar i b{inset:0 0 0 auto}
.bar span:last-child{font-family:var(--f-mono);text-align:end;color:var(--ink)}

.verdict{border-inline-start:3px solid var(--accent);padding:4px 0 4px 14px;padding-inline:14px 0;margin:18px 0;max-width:75ch;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}

.detail{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:start;font-size:12px;padding:6px 10px 6px 0;padding-inline:0 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px 9px 0;padding-inline:0 12px;border-bottom:1px solid var(--line);vertical-align:top}
td .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.cell{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:6px;font-family:var(--f-mono);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin-block-start:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ink)}
.legend i.d{border-top-style:dashed}
.legend i.blk{height:10px;width:10px;border:0;border-radius:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.wl{display:flex;flex-direction:column;gap:6px}
.wl .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:6px;font-size:14px}
.up{color:var(--accent)}.dn{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{border-top:2px solid var(--line);padding-block:10px 0;display:flex;flex-direction:column;gap:4px}
.tile .n{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.tile .l{font-size:13px}
.tile .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
#app[dir=rtl] .tile .s{font-family:'Cairo',sans-serif}
.tile .g{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;margin-block-start:4px}
.tile .g b{position:absolute;inset:0 auto 0 0;background:var(--clay)}
#app[dir=rtl] .tile .g b{inset:0 0 0 auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block-start:14px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
textarea.copybox{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-block-start:10px}
details{border-top:1px solid var(--line);padding-block:12px}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px}
details ul{margin:10px 0 0;padding-inline-start:20px;max-width:75ch;color:var(--muted)}
details li{margin-block-end:6px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
svg text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.rcard{transition:border-color .15s,box-shadow .15s}}
</style>

var S={lang:"en",region:"nile",soil:"loam",som:1.3,sal:1,irr:"full",last:"wheat",dT:2,rf:-10,cut:20,
       w:{soil:8,water:7,profit:5,res:7},sel:0};
try{var sv=localStorage.getItem("av_lang"); if(sv==="ar"||sv==="en") S.lang=sv;}catch(e){}
var RES=null;
function t(k){return TX[S.lang][k];}
function nm(c){return S.lang==="ar"?c.ar:c.en;}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function clamp(x,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.max(a,Math.min(b,x));}
function sgn(x,u){return (x>0?"+":"")+x+u;}
function cropById(id){for(var i=0;i<CROPS.length;i++)if(CROPS[i].id===id)return CROPS[i];return CROPS[0];}

/* ---------- Engine ---------- */
function trap(T,c){
 if(T<=c.tmin||T>=c.tmax)return 0;
 if(T<c.t1)return (T-c.tmin)/(c.t1-c.tmin);
 if(T<=c.t2)return 1;
 return (c.tmax-T)/(c.tmax-c.t2);
}
function evalCrop(c,R,cl){
 var T=R.T.map(function(x){return x+cl.dT;}),P=R.P.map(function(x){return x*cl.rf;});
 var hw=T.map(function(x){return Math.pow(Math.max(0,x-22),2);});
 var hs=hw.reduce(function(a,b){return a+b;},0)||1;
 var heatYear=(R.heat+3*cl.dT)*(1+.3*cl.dT)*cl.hm;
 var cap=({rainfed:0,limited:300,full:1000})[S.irr]*(1-cl.cut);
 var awc=({sand:.85,loam:1,clay:.95,silt:1.05})[S.soil];
 var tex=c.soil[S.soil];
 var salt=1-clamp((S.sal-c.salt)*.3,0,.9);
 var starts=[];
 if(c.L>=12)starts=[0];else for(var q=0;q<12;q++)starts.push(q);
 var best=null;
 starts.forEach(function(s){
  var sum=0,mn=1,rain=0,hsum=0,i,m,v;
  for(i=0;i<c.L;i++){m=(s+i)%12;v=trap(T[m],c);sum+=v;mn=Math.min(mn,v);rain+=P[m];hsum+=hw[m];}
  var mean=sum/c.L;
  var tf=c.L>=12?(.5+.5*mean):(.6*mean+.4*mn);
  var hd=heatYear*hsum/hs;
  var hf=1/(1+.5*Math.pow(hd/c.heat,1.5));
  var eff=.8*rain,def=Math.max(0,c.water-eff),irr=Math.min(def,cap),unmet=Math.max(0,def-irr);
  var wf=clamp(1-c.dsens*(unmet/c.water)/awc);
  var y=tf*hf*wf*tex*salt;
  var obj=y-irr/6000;
  if(!best||obj>best.obj)best={obj:obj,y:y,start:s,irr:irr,rain:eff,heat:hd,tf:tf,hf:hf,wf:wf,tex:tex,salt:salt};
 });
 return best;
}
function simSOM(seq,ys,Tmean){
 var out=[S.som],s=S.som;
 var tx=({sand:1.25,loam:1,clay:.8,silt:.95})[S.soil];
 var k=Math.max(.01,.022*(1+.07*(Tmean-15))*tx);
 for(var y=0;y<10;y++){var i=y%seq.length,c=seq[i];s=s+c.om*(.5+.5*ys[i])-k*s;out.push(s);}
 return out;
}
function evalSeq(crops,EV,Tmean){
 var n=crops.length;
 function adj(set){
  return crops.map(function(c,i){
   var p=crops[(i-1+n)%n],y=EV[set][c.id].y;
   if((p.legume)&&!c.legume)y=Math.min(1,y*1.08);
   return y;
  });
 }
 var ys=adj("scen"),yst=adj("stress"),yb=adj("base");
 var irrs=crops.map(function(c){return EV.scen[c.id].irr;});
 var som=simSOM(crops,ys,Tmean);
 var delta=som[10]-S.som;
 var nC=crops.reduce(function(a,c){return a+c.n;},0)/n;
 var cov=crops.reduce(function(a,c){return a+c.cover;},0)/n;
 var soil=.65*clamp((delta+.4)/1.2)+.2*clamp(nC/90)+.15*cov;
 var irrMean=irrs.reduce(function(a,b){return a+b;},0)/n;
 var water=clamp(1-irrMean/700);
 var profit=clamp(crops.reduce(function(a,c,i){return a+ys[i]*c.profit;},0)/n/.7);
 var mean=function(a){return a.reduce(function(x,y){return x+y;},0)/a.length;};
 var res=.6*mean(yst)+.4*Math.min.apply(null,ys);
 return {crops:crops,ys:ys,yst:yst,yb:yb,irrs:irrs,irrMean:irrMean,som:som,nC:nC,sc:{soil:soil,water:water,profit:profit,res:res}};
}
function compute(){
 var R=REG[S.region];
 var CL={base:{dT:0,rf:1,cut:0,hm:1},
         scen:{dT:S.dT,rf:1+S.rf/100,cut:S.cut/100,hm:1},
         stress:{dT:S.dT+1.5,rf:(1+S.rf/100)*.7,cut:Math.min(.8,S.cut/100+.25),hm:1.4}};
 var EV={base:{},scen:{},stress:{}};
 CROPS.forEach(function(c){for(var k in CL)EV[k][c.id]=evalCrop(c,R,CL[k]);});
 var Tm=R.T.reduce(function(a,b){return a+b;},0)/12+S.dT;
 var lastC=cropById(S.last);
 var w=S.w,ws=w.soil+w.water+w.profit+w.res;
 function total(sc){
  if(ws<=0)return (sc.soil+sc.water+sc.profit+sc.res)/4;
  return (w.soil*sc.soil+w.water*sc.water+w.profit*sc.profit+w.res*sc.res)/ws;
 }
 var pool=[],thr=[.25,.12],cands=[],i,j,k,tries;
 for(tries=0;tries<2;tries++){
  pool=CROPS.filter(function(c){return avail(c)&&EV.scen[c.id].y>=thr[tries];});
  cands=[];
  for(i=0;i<pool.length;i++)for(j=0;j<pool.length;j++)for(k=0;k<pool.length;k++){
   if(i===j||j===k||i===k)continue;
   if(!(i<j&&i<k))continue;
   var a=pool[i],b=pool[j],c=pool[k];
   if(a.fam===b.fam||b.fam===c.fam||c.fam===a.fam)continue;
   if(a.fam===lastC.fam&&a.fam!=="cov")continue;
   var r=evalSeq([a,b,c],EV,Tm);
   r.total=total(r.sc);
   cands.push(r);
  }
  if(cands.length>=3)break;
 }
 cands.sort(function(x,y){return y.total-x.total;});
 var top=[],seen={};
 for(i=0;i<cands.length&&top.length<3;i++){
  var key=cands[i].crops.map(function(c){return c.id;}).sort().join("|");
  if(seen[key])continue;seen[key]=1;top.push(cands[i]);
 }
 var bau=evalSeq([lastC],EV,Tm);bau.total=total(bau.sc);
 if(S.sel>=top.length)S.sel=0;
 return {R:R,CL:CL,EV:EV,top:top,bau:bau,Tm:Tm,lastC:lastC};
}

function pol(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,s,L){
 if(L>=12)return "M"+(cx-r)+" "+cy+"a"+r+" "+r+" 0 1 0 "+(2*r)+" 0a"+r+" "+r+" 0 1 0 "+(-2*r)+" 0";

 return "M"+p0[0].toFixed(1)+" "+p0[1].toFixed(1)+"A"+r+" "+r+" 0 "+(L*30>180?1:0)+" 1 "+p1[0].toFixed(1)+" "+p1[1].toFixed(1);
}

function orbitSVG(rot,EV){

 o+='<svg viewBox="0 0 360 360" role="img" aria-label="'+t("h_orbit")+'">';
 for(var m=0;m<12;m++){

function climateSVG(R,CL){

 var tMin=Math.min.apply(null,T0.concat(T1))-2,tMax=Math.max.apply(null,T0.concat(T1))+2;
 var py=function(p){return h-b-p/pMax*(h-tp-b);};
 var ty=function(x){return h-b-(x-tMin)/(tMax-tMin)*(h-tp-b);};
 var o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+t("h_clim")+'">';
 for(var g=0;g<=4;g++){var yy=tp+g*(h-tp-b)/4;o+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';}
 for(var m=0;m<12;m++){

  o+='<rect x="'+(x+pw*.12)+'" y="'+py(P0[m])+'" width="'+pw*.34+'" height="'+(h-b-py(P0[m]))+'" fill="var(--muted)" opacity=".45"/>';

 }
 function line(arr,st){return '<polyline fill="none" '+st+' points="'+arr.map(function(v,m){return (l+m*pw+pw/2).toFixed(1)+','+ty(v).toFixed(1);}).join(" ")+'"/>';}
 o+=line(T0,'stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 4"');
 o+=line(T1,'stroke="var(--clay)" stroke-width="2.4"');
 o+='<text x="'+(l-6)+'" y="'+(tp+3)+'" text-anchor="end">'+Math.round(tMax)+'°</text><text x="'+(l-6)+'" y="'+(h-b)+'" text-anchor="end">'+Math.round(tMin)+'°</text>';
 o+='<text x="'+(w-r+6)+'" y="'+(tp+3)+'">'+Math.round(pMax)+'</text><text x="'+(w-r+6)+'" y="'+(h-b)+'">0</text>';
 o+='</svg>';

 return o;
}

  ["i_s",sg(dS),""]
 ];
 return '<h3 class="eyebrow" style="margin:22px 0 4px">'+t("e_imp")+'</h3><div class="tiles" style="margin-block-end:6px">'+tiles.map(function(x){return '<div class="tile"><span class="n">'+x[1]+'</span><span class="l">'+t(x[0])+'</span><span class="s">'+t(x[0]+"_u")+'</span>'+x[2]+'</div>';}).join("")+'</div><p class="hint">'+t("imp_note")+'</p>';

function whyBlock(D){

 var inTop={};
 D.top.forEach(function(r,i2){r.crops.forEach(function(c){(inTop[c.id]=inTop[c.id]||[]).push(String.fromCharCode(65+i2));});});
 if(!S.why||!list.some(function(c){return c.id===S.why;})){
  var d=list.filter(function(c){return !inTop[c.id];})[0]||list[0];S.why=d.id;
 }
 var c=cropById(S.why),ev=D.EV.scen[c.id],eb=D.EV.base[c.id];
 var fac=[["lim_t",ev.tf,"t"],["lim_h",ev.hf,"h"],["lim_w",ev.wf,"w"],["lim_s",ev.tex,"s"],["lim_sa",ev.salt,"sa"]];
 fac.sort(function(a,b){return a[1]-b[1];});
 var worst=fac[0],o={c:nm(c),y:Math.round(ev.y*100),b:Math.round(eb.y*100),lim:t(worst[0]),k:"low"};
 var lastC=D.lastC;
 var txt;
 if(inTop[c.id]){o.k="in";o.r=inTop[c.id].join(", ");txt=t("why")(o);}
 else if(ev.y>=.25){
  if(c.fam===lastC.fam&&c.fam!=="cov"){o.k="fam";o.l=nm(lastC);}else o.k="ok";
  txt=t("why")(o);
 }
 else{
  var k=worst[2],det;
  if(k==="t")det=t("det")("t",{p:Math.round(ev.tf*100)});
  else if(k==="h")det=t("det")("h",{h:Math.round(ev.heat),c:c.heat});
  else if(k==="w")det=t("det")("w",{w:c.water,r:Math.round(ev.rain),i:Math.round(ev.irr)});
  else if(k==="s")det=t("det")("s",{soil:t(S.soil),p:Math.round(ev.tex*100)});
  else det=t("det")("sa",{t:c.salt,s:S.sal});
  o.det=det;txt=t("why")(o);
 }
 var opts=list.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.why?' selected':'')+'>'+nm(x)+'</option>';}).join("");
 return '<section class="sec"><span class="eyebrow">'+t("e_why")+'</span><h2>'+t("h_why")+'</h2><div class="field" style="max-width:320px"><label for="why">'+t("why_pick")+'</label><select id="why">'+opts+'</select></div><p class="verdict">'+txt+'</p></section>';
}
function climateBlock(D){
 return '<section class="sec"><span class="eyebrow">'+t("e_clim")+'</span><h2>'+t("h_clim")+'</h2>'+climateSVG(D.R,D.CL)+'</section>';
}
function nasaBlock(D){
 var R=D.R;
 var tiles=[
  ["n_t",(R.tT>0?"+":"")+R.tT,clamp(R.tT/.6)],
  ["n_r",(R.tR>0?"+":"")+R.tR,clamp(-R.tR/8)],
  ["n_sm",R.smap,clamp((100-R.smap)/100)],
  ["n_d",R.drought,clamp(R.drought/60)],
  ["n_h",R.heat,clamp(R.heat/200)],
  ["n_g",(R.grace>0?"+":"")+R.grace,clamp(-R.grace/4)]
 ];
 return '<section class="sec"><span class="eyebrow">'+t("e_nasa")+'</span><h2>'+t("h_nasa")+'</h2><div class="tiles">'+tiles.map(function(x){return '<div class="tile"><span class="n">'+x[1]+'</span><span class="l">'+t(x[0])+' <span class="hint">'+t(x[0]+"_u")+'</span></span><span class="s">'+t(x[0]+"_s")+'</span><div class="g"><b style="width:'+Math.round(x[2]*100)+'%"></b></div></div>';}).join("")+'</div></section>';
}
function howBlock(){
 return '<details><summary>'+t("h_how")+'</summary><ul>'+t("how").map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></details>';
}

/* ---------- Events ---------- */
function bind(){
 var app=document.getElementById("app");
 app.addEventListener("input",function(e){
  var id=e.target.id;if(!id)return;
  if(e.target.type==="range"){
   var v=Number(e.target.value);
   var lab=document.getElementById("v_"+id);if(lab)lab.textContent=fmtVal(id,v);
   if(id==="som")S.som=v;else if(id==="dT")S.dT=v;else if(id==="rf")S.rf=v;else if(id==="cut")S.cut=v;
   else if(id.indexOf("w_")===0)S.w[id.slice(2)]=v;
   renderResults();
  }
 });
 app.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="region"){S.region=e.target.value;renderResults();}
  else if(id==="last"){S.last=e.target.value;renderResults();}
  else if(id==="why"){S.why=e.target.value;renderResults();}
 });
 app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;try{localStorage.setItem("av_lang",S.lang);}catch(x){}buildShell();renderResults();return;}
  var g=b.closest("[data-seg]");
  if(g){
   var k=g.dataset.seg,v=b.dataset.v;
   S[k]=(k==="sal")?Number(v):v;
   g.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
   renderResults();return;
  }
  if(b.dataset.sel!==undefined){S.sel=Number(b.dataset.sel);renderResults();return;}
  if(b.id==="cApply"){applyCustom();return;}
  if(b.id==="copyBtn"){
   var rot=RES.top[S.sel],txt=planText(RES,rot),msg=document.getElementById("copyMsg"),holder=document.getElementById("copyHolder");
   var fallback=function(){holder.innerHTML='<textarea class="copybox" id="copyBox" readonly></textarea>';var ta=document.getElementById("copyBox");ta.value=txt;ta.focus();ta.select();msg.textContent=t("copyfail");};
   try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg.textContent=t("copied");},fallback);}
    else fallback();
   }catch(x){fallback();}
  }
 });
}
function applyCustom(){
 var ta=document.getElementById("cjson"),msg=document.getElementById("cMsg"),raw=ta.value,j;
 try{
  j=JSON.parse(raw);
  var ok=function(a){return Array.isArray(a)&&a.length===12&&a.every(function(x){return typeof x==="number"&&isFinite(x);});};
  if(!ok(j.T)||!ok(j.P)||j.T.some(function(x){return x<-50||x>60;})||j.P.some(function(x){return x<0;}))throw new Error("bad");
  var num=function(v,d){return typeof v==="number"&&isFinite(v)?v:d;};
  REG.custom={en:"Custom",ar:"مخصص",T:j.T,P:j.P,heat:num(j.heat,0),tT:num(j.tT,0),tR:num(j.tR,0),smap:num(j.smap,50),drought:num(j.drought,30),grace:num(j.grace,0)};
  S.region="custom";S.cjson=raw;
  buildShell();renderResults();
  document.getElementById("custom").open=true;document.getElementById("cMsg").textContent=t("c_ok");
 }catch(err){msg.textContent=t("c_err");}
}
buildShell();bind();renderResults();
})();
</script>
